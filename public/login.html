<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1120">
    <title>Welcome | Expense Tracker</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            padding: 36px;
            background: #111a2e;
            border: 1px solid #25324a;
            border-radius: 18px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
        }

        .auth-brand {
            margin-bottom: 30px;
            text-align: center;
        }

        .auth-logo {
            width: 54px;
            height: 54px;
            display: grid;
            place-items: center;
            margin: 0 auto 16px;
            border-radius: 16px;
            background: #6366f1;
            color: white;
            font-size: 25px;
            font-weight: 800;
        }

        .auth-brand h1 {
            margin-bottom: 8px;
            font-size: 26px;
        }

        .auth-brand p,
        .auth-switch {
            color: #94a3b8;
            font-size: 14px;
        }

        .auth-form {
            display: grid;
            gap: 17px;
        }

        .auth-field {
            display: grid;
            gap: 8px;
        }

        .auth-field label {
            font-size: 14px;
            font-weight: 600;
        }

        .auth-field input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #334155;
            border-radius: 9px;
            outline: none;
            background: #0b1120;
            color: #f8fafc;
            font: inherit;
        }

        .auth-field input:focus {
            border-color: #818cf8;
        }

        .auth-submit {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            background: #6366f1;
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .auth-submit:hover {
            background: #4f46e5;
        }

        .auth-submit:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .auth-switch {
            margin-top: 22px;
            text-align: center;
        }

        .auth-switch button {
            border: 0;
            background: none;
            color: #a5b4fc;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .auth-message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .auth-message.error {
            display: block;
            background: #451a24;
            color: #fecdd3;
        }

        .auth-message.success {
            display: block;
            background: #12352a;
            color: #bbf7d0;
        }

        .auth-field small {
            color: #94a3b8;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>
    <main class="auth-container">
        <header class="auth-brand">
            <div class="auth-logo">₦</div>
            <h1 id="authTitle">Welcome back</h1>
            <p id="authSubtitle">Sign in to manage your finances.</p>
        </header>

        <div id="authMessage" class="auth-message" role="status" aria-live="polite"></div>

        <form id="authForm" class="auth-form">
            <div class="auth-field" id="nameField" hidden>
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" maxlength="80" autocomplete="name">
            </div>

            <div class="auth-field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" maxlength="254" autocomplete="email" required>
            </div>

            <div class="auth-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" minlength="8" maxlength="72"
                    autocomplete="current-password" required>
                <small id="passwordHelp">Enter your password.</small>
            </div>

            <button class="auth-submit" id="submitButton" type="submit">
                Sign In
            </button>
        </form>

        <p class="auth-switch">
            <span id="switchText">Don't have an account?</span>
            <button type="button" id="switchMode">Create one</button>
        </p>
    </main>

    <script src="/js/auth.js"></script>
</body>

</html>
